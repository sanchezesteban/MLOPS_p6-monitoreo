name: P5 CI

# CI del Proyecto 5 (contrato A->B, política y adaptador virtual). Cubre el
# paquete `Proyecto5/src/p5` y sus pruebas: ningún otro workflow los ejecuta.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  p5-python:
    name: P5 · Ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Proyecto5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            Proyecto5/requirements.txt
            Proyecto5/requirements-capturas.txt

      # requirements.txt fija la base; requirements-capturas.txt añade OpenCV.
      # Resolver ambos juntos conserva las restricciones de NumPy de la base.
      - name: Instalar dependencias base y captura
        run: pip install -r requirements.txt -r requirements-capturas.txt

      # El build DEBE fallar si el lint o las pruebas fallan: sin `continue-on-error`.
      - name: Ruff (lint)
        run: ruff check .

      - name: pytest
        run: pytest
