name: P5 CI

# CI del Proyecto 5 (contrato A->B, política y adaptador virtual). Cubre el
# paquete `Proyecto5/src/p5` y sus pruebas: ningún otro workflow los ejecuta.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  p5-python:
    name: P5 · Ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Proyecto5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Proyecto5/requirements.txt

      # requirements.txt fija también las dependencias indirectas: el árbol de
      # este job es el mismo que se probó en local con `pip freeze`.
      - name: Instalar dependencias (fijadas)
        run: pip install -r requirements.txt

      # El build DEBE fallar si el lint o las pruebas fallan: sin `continue-on-error`.
      - name: Ruff (lint)
        run: ruff check .

      # Pesos publicos del detector (P5-03); sin ellos se omiten las pruebas del modelo real.
      - name: Descargar pesos del detector (verifica SHA-256)
        run: python scripts/descargar_modelo.py --destino modelo/

      - name: pytest
        run: pytest -rs
