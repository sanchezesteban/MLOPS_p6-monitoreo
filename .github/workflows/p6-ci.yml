name: P6 CI

# Proyecto 6 (entrega individual): lint, pruebas y recalculo de la evidencia versionada.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  p6-python:
    name: P6 · Ruff + pytest + recalculo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Proyecto6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Proyecto6/requirements.txt
      - run: pip install -r requirements.txt
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Descargar pesos publicos de YOLOX-Nano (verifica SHA-256)
        run: python ../Proyecto5/scripts/descargar_modelo.py --destino ../Proyecto5/modelo/
      - name: pytest
        run: pytest -rs
      - name: Recalcular metricas de la evidencia versionada
        run: |
          for d in evidencias/escenarios/*/; do
            if [ -f "$d/run.json" ]; then PYTHONPATH=src python -m p6.recalcular --run "$d"; fi
          done
