# Expectativa del caso (P5-15). Solo la lee el runner para comparar; nunca es entrada del
# detector ni de la politica. Cambios posteriores al congelado llevan justificacion geometrica.
id: C04
secuencia: S4
acciones_por_cuadro: cuadros_S4.csv
estados_requeridos: [der]
plazo_reaccion_cuadros: 0  # el STOP sale en el mismo cuadro donde la anotacion pone el obstaculo
plazo_reaccion_ms: 100  # un cuadro del replay fijo de P5-14; igual a config/watchdog.yaml
requisitos:
  - tipo: movimiento_minimo
    min_cuadros: 1
    justificacion: El centro esta libre; avanzar o corregir a la izquierda es seguro.
justificacion: >-
  Espejo de C03. Se permite FORWARD, STEER_LEFT o STOP; STEER_RIGHT dirige el auto hacia la zona
  ocupada. Comprueba el signo de steering (negativo = izquierda).
