# Configuracion del runtime del detector (P5-04, #56). La lee `p5.detector_onnx.cargar_config`,
# que rechaza claves desconocidas y valores fuera de rango. Las rutas son relativas a este
# archivo; `--modelo` en la CLI reemplaza `modelo`.
# Congelada antes de calcular metricas: no se ajusta contra el conjunto de evaluacion.
version: 1

modelo: ../modelo/yolox_nano.onnx        # se descarga con scripts/descargar_modelo.py
descriptor: ../modelo/descriptor.yaml    # SHA-256 esperado (comparacion exacta) y clases

preprocesamiento:
  tamano_entrada: 416   # lado del tensor cuadrado de YOLOX-Nano
  relleno: 114          # gris del letterbox, como en el entrenamiento de YOLOX

posprocesamiento:
  # Igual a `confianza.minimo_incierto` de politica.yaml: el detector entrega todo lo que
  # la politica usa (inciertos >= 0.30 y ciertos >= 0.50) y nada por debajo.
  umbral_confianza: 0.30
  nms_iou: 0.45           # NMS por clase; valor por defecto de YOLOX
  max_detecciones: 100    # tope por cuadro despues del NMS, ordenadas por confianza
