# Detector preentrenado de P5 (P5-03, #55). Los pesos no van en Git: se descargan de
# la URL publica con `python scripts/descargar_modelo.py --destino <dir>`, que falla con
# codigo != 0 si el SHA-256 no coincide. Sin credenciales, S3 ni enlaces temporales.
# No hubo entrenamiento nuevo: se usan los pesos publicados tal cual.

nombre: yolox_nano
version: "0.1.1rc0"           # tag del release de YOLOX
archivo: yolox_nano.onnx
url: https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_nano.onnx
bytes: 3659407
sha256: c789161ed43c8269fcd4e67c67eeeb4e80c622da2eb296a20bc6007bd18a0b7d

origen:
  proyecto: YOLOX (Megvii-BaseDetection)
  repositorio: https://github.com/Megvii-BaseDetection/YOLOX
  release: https://github.com/Megvii-BaseDetection/YOLOX/releases/tag/0.1.1rc0
  entrenamiento: COCO 2017 train, 80 clases (pesos oficiales, sin ajuste del equipo)
  referencia: "Ge et al., YOLOX: Exceeding YOLO Series in 2021, arXiv:2107.08430"
licencia: Apache-2.0
licencia_url: https://github.com/Megvii-BaseDetection/YOLOX/blob/main/LICENSE

runtime:
  formato: onnx
  probado_con: onnxruntime==1.30.0 (CPUExecutionProvider)

# Contrato de entrada/salida del archivo ONNX, verificado al cargar en onnxruntime.
# El pre/posprocesamiento completo (letterbox, decodificacion de la rejilla, umbral y NMS)
# lo implementa el runtime de P5-04 (#56).
entrada:
  nombre: images
  forma: [1, 3, 416, 416]       # NCHW float32
  orden_canales: BGR
  escala: "0-255, sin normalizar (export de 0.1.1rc0)"
  letterbox: "redimension proporcional r = min(416/H, 416/W), pegada arriba a la izquierda, relleno 114"
salida:
  nombre: output
  forma: [1, 3549, 85]          # 3549 = 52^2 + 26^2 + 13^2 anclas, strides 8/16/32
  columnas: "cx, cy, w, h (relativos a la rejilla), objectness, 80 probabilidades de clase"
  decodificacion: "xy = (salida + rejilla) * stride; wh = exp(salida) * stride; score = objectness * prob_clase"

# Clases que la politica trata como obstaculo (acordadas por los PM; ver config/politica.yaml).
# Mapeo desde COCO: el detector entrega `class_id` (indice 0-79 de COCO) y `class_name`
# con el nombre COCO tal cual, asi que no hay renombrado.
clases_obstaculo:
  - {class_id: 0, class_name: person}
  - {class_id: 15, class_name: cat}
  - {class_id: 16, class_name: dog}

# Lista completa de clases del modelo, en orden de indice (class_id = posicion).
