[project]
name = "p6-monitoreo"
version = "1.0.0"
description = "Proyecto 6: centro de monitoreo de computer vision (entrega individual)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../Proyecto5/src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["p6", "p5"]
